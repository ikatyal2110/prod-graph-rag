name: Eval Gate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  eval:
    runs-on: ubuntu-latest
    
    services:
      neo4j:
        image: neo4j:5
        env:
          NEO4J_AUTH: neo4j/testpassword
        ports:
          - 7474:7474
          - 7687:7687
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('graph_rag_api/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Install dependencies
        working-directory: graph_rag_api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Check graph metadata
        run: |
          python scripts/update_graph_metadata.py --check
      
      - name: Validate graph
        run: |
          python graph/validate_graph.py complete_graph.json
      
      - name: Wait for Neo4j to be ready
        working-directory: graph_rag_api
        run: |
          echo "Waiting for Neo4j to be ready..."
          python -c "
          import sys
          import time
          from neo4j import GraphDatabase
          
          uri = 'bolt://localhost:7687'
          user = 'neo4j'
          password = 'testpassword'
          
          for i in range(30):
              try:
                  driver = GraphDatabase.driver(uri, auth=(user, password))
                  with driver.session() as session:
                      session.run('RETURN 1')
                  driver.close()
                  print('Neo4j is ready!')
                  sys.exit(0)
              except Exception as e:
                  if i < 29:
                      print(f'Attempt {i+1}/30: Neo4j not ready yet, waiting 2 seconds...')
                      time.sleep(2)
                  else:
                      print(f'Neo4j failed to start: {e}')
                      sys.exit(1)
          "
        env:
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: testpassword
          NEO4J_DB: neo4j
      
      - name: Load graph into Neo4j
        working-directory: graph_rag_api
        run: |
          python scripts/load_graph.py --graph-file ../complete_graph.json
        env:
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: testpassword
          NEO4J_DB: neo4j
      
      - name: Start API server
        working-directory: graph_rag_api
        run: |
          uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          echo $! > /tmp/api.pid
          # Wait for API to be ready
          python -c "
          import sys
          import time
          import requests
          
          for i in range(30):
              try:
                  response = requests.get('http://localhost:8000/health', timeout=2)
                  if response.status_code == 200:
                      print('API is ready!')
                      sys.exit(0)
              except Exception:
                  if i < 29:
                      print(f'Attempt {i+1}/30: API not ready yet, waiting 1 second...')
                      time.sleep(1)
                  else:
                      print('API failed to start')
                      sys.exit(1)
          "
        env:
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: testpassword
          NEO4J_DB: neo4j
      
      - name: Run eval on golden_queries.jsonl
        run: |
          cd ${{ github.workspace }}
          python eval/run_eval.py --gold eval/golden_queries.jsonl --k 5 --base-url http://localhost:8000
        env:
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: testpassword
          NEO4J_DB: neo4j
      
      - name: Run eval on golden_queries_hard.jsonl
        run: |
          cd ${{ github.workspace }}
          python eval/run_eval.py --gold eval/golden_queries_hard.jsonl --k 5 --base-url http://localhost:8000
        env:
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: testpassword
          NEO4J_DB: neo4j
      
      - name: Stop API server
        if: always()
        run: |
          if [ -f /tmp/api.pid ]; then
            kill $(cat /tmp/api.pid) || true
          fi

